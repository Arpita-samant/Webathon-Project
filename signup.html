<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Create Account</h1>

            <p>Join us today</p>

            <form id="signupForm">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >

                <button type="submit">
                    SIGN UP
                </button>

            </form>

            <p id="signupMessage"></p>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
